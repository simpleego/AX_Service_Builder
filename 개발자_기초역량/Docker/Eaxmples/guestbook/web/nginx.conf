server {
    listen 80;

    # 화면 파일
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # /api 로 시작하는 요청은 FastAPI 컨테이너로 전달
    location /api/ {
        proxy_pass http://api:8000;          # 'api' = 네트워크 안에서의 이름
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
