# ============================================================
#  MySQL 8.4 DB 서버 (Docker Compose)
#  실행: docker compose up -d      정리: docker compose down
# ============================================================
services:
  mysql:
    image: mysql:8.4                    # 8.4 = LTS(장기 지원) 버전
    container_name: lab-mysql
    restart: unless-stopped             # VM 재부팅 / 장애 시 자동 재시작 -> "서버"로 동작
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost        # root 는 컨테이너 내부에서만 접속 허용 (원격 차단)
      MYSQL_DATABASE: ${MYSQL_DATABASE} # 최초 실행 시 생성할 DB
      MYSQL_USER: ${MYSQL_USER}         # 원격 접속용 일반 계정 (위 DB 에 대한 전체 권한)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"                     # VM 3306 -> 컨테이너 3306  (Windows 13306 -> VM 3306 은 VirtualBox 가 담당)
    volumes:
      - mysql-data:/var/lib/mysql                      # 데이터 영구 저장 (Named Volume)
      - ./conf/my.cnf:/etc/mysql/conf.d/lab.cnf:ro     # 서버 설정
      - ./init:/docker-entrypoint-initdb.d:ro          # 최초 1회 실행되는 SQL (테이블/샘플 데이터)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
