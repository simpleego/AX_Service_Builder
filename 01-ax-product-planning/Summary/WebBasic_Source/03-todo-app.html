<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예제 3 - 할 일 관리</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px 15px; font-family: Arial, sans-serif; background: #e9eef5; color: #263238; }
    .app { width: min(650px, 100%); margin: auto; padding: 28px; border-radius: 14px; background: white; box-shadow: 0 8px 25px #0002; }
    h1 { text-align: center; }
    .input-row { display: flex; gap: 8px; }
    input, button { padding: 11px; font: inherit; }
    input { flex: 1; min-width: 0; border: 1px solid #adb5bd; border-radius: 6px; }
    button { border: 0; border-radius: 6px; color: white; background: #1971c2; cursor: pointer; }
    .filters { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
    .filters button { background: #868e96; }
    .filters button.active { background: #1971c2; }
    ul { padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 10px; margin: 8px 0; padding: 12px; border-radius: 6px; background: #f1f3f5; }
    li span { flex: 1; }
    li.completed span { color: #868e96; text-decoration: line-through; }
    .toggle { width: 20px; height: 20px; }
    .delete { padding: 7px 10px; background: #e03131; }
    .summary { text-align: right; color: #495057; }
    @media (max-width: 480px) { .input-row { flex-direction: column; } .filters { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <main class="app">
    <h1>오늘의 할 일</h1>

    <form id="todoForm" class="input-row">
      <label for="todoInput" hidden>새 할 일</label>
      <input id="todoInput" type="text" required placeholder="할 일을 입력하세요">
      <button type="submit">추가</button>
    </form>

    <nav class="filters" aria-label="할 일 필터">
      <button type="button" class="active" data-filter="all">전체</button>
      <button type="button" data-filter="active">진행 중</button>
      <button type="button" data-filter="completed">완료</button>
    </nav>

    <ul id="todoList"></ul>
    <p id="summary" class="summary"></p>
  </main>

  <script>
    const todoForm = document.querySelector('#todoForm');
    const todoInput = document.querySelector('#todoInput');
    const todoList = document.querySelector('#todoList');
    const summary = document.querySelector('#summary');
    const filterButtons = document.querySelectorAll('[data-filter]');

    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    let currentFilter = 'all';

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function getVisibleTodos() {
      if (currentFilter === 'active') return todos.filter(todo => !todo.completed);
      if (currentFilter === 'completed') return todos.filter(todo => todo.completed);
      return todos;
    }

    function renderTodos() {
      todoList.innerHTML = '';

      getVisibleTodos().forEach(function (todo) {
        const item = document.createElement('li');
        if (todo.completed) item.classList.add('completed');

        item.innerHTML = `
          <input class="toggle" type="checkbox" ${todo.completed ? 'checked' : ''} aria-label="완료 상태 변경">
          <span></span>
          <button class="delete" type="button">삭제</button>
        `;
        item.querySelector('span').textContent = todo.text;

        item.querySelector('.toggle').addEventListener('change', function () {
          todo.completed = !todo.completed;
          saveTodos();
          renderTodos();
        });

        item.querySelector('.delete').addEventListener('click', function () {
          todos = todos.filter(item => item.id !== todo.id);
          saveTodos();
          renderTodos();
        });

        todoList.appendChild(item);
      });

      const remaining = todos.filter(todo => !todo.completed).length;
      summary.textContent = '전체 ' + todos.length + '개 · 남은 일 ' + remaining + '개';
    }

    todoForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      todos.push({ id: Date.now(), text: text, completed: false });
      saveTodos();
      renderTodos();
      todoForm.reset();
      todoInput.focus();
    });

    filterButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        currentFilter = button.dataset.filter;
        filterButtons.forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        renderTodos();
      });
    });

    renderTodos();
  </script>
</body>
</html>
