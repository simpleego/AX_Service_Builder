<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예제 2 - 반응형 상품 카드</title>
  <style>
    :root { --main: #6c5ce7; --dark: #2d3436; --light: #f7f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: var(--dark); background: var(--light); }
    .page-header { padding: 40px 20px; text-align: center; color: white; background: linear-gradient(135deg, #6c5ce7, #0984e3); }
    .page-header h1 { margin: 0 0 10px; }
    .container { width: min(1100px, 92%); margin: 35px auto; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .card { overflow: hidden; border: 1px solid #ddd; border-radius: 14px; background: white; box-shadow: 0 5px 16px #0001; transition: transform 0.25s, box-shadow 0.25s; }
    .card:hover { transform: translateY(-7px); box-shadow: 0 12px 25px #0003; }
    .card-image { display: grid; place-items: center; height: 160px; font-size: 64px; background: #eeeafd; }
    .card:nth-child(2) .card-image { background: #e3f2fd; }
    .card:nth-child(3) .card-image { background: #e8f5e9; }
    .card-content { padding: 20px; }
    .tag { display: inline-block; padding: 5px 9px; border-radius: 20px; color: var(--main); background: #eeeafd; font-size: 13px; }
    .price { font-size: 22px; font-weight: bold; }
    .card button { width: 100%; padding: 11px; border: 0; border-radius: 7px; color: white; background: var(--main); cursor: pointer; }
    .card button:focus { outline: 3px solid #fdcb6e; outline-offset: 2px; }
    #notice { min-height: 28px; margin-top: 25px; text-align: center; font-weight: bold; color: #087f5b; }
    @media (max-width: 800px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } .page-header { padding: 28px 15px; } }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>개발자 학습 상점</h1>
    <p>화면 너비를 바꾸어 반응형 배치를 확인하세요.</p>
  </header>

  <main class="container">
    <section class="cards" aria-label="강의 상품 목록">
      <article class="card">
        <div class="card-image" aria-hidden="true">📄</div>
        <div class="card-content">
          <span class="tag">HTML</span>
          <h2>문서 구조 입문</h2>
          <p>시맨틱 태그와 폼을 배우는 기초 과정입니다.</p>
          <p class="price">₩15,000</p>
          <button data-product="HTML 문서 구조 입문">장바구니 담기</button>
        </div>
      </article>

      <article class="card">
        <div class="card-image" aria-hidden="true">🎨</div>
        <div class="card-content">
          <span class="tag">CSS</span>
          <h2>반응형 디자인</h2>
          <p>Flexbox, Grid, 미디어 쿼리를 연습합니다.</p>
          <p class="price">₩20,000</p>
          <button data-product="CSS 반응형 디자인">장바구니 담기</button>
        </div>
      </article>

      <article class="card">
        <div class="card-image" aria-hidden="true">⚙️</div>
        <div class="card-content">
          <span class="tag">JavaScript</span>
          <h2>웹 동작 구현</h2>
          <p>DOM과 이벤트로 상호작용을 구현합니다.</p>
          <p class="price">₩25,000</p>
          <button data-product="JavaScript 웹 동작 구현">장바구니 담기</button>
        </div>
      </article>
    </section>
    <p id="notice" role="status"></p>
  </main>

  <script>
    const buttons = document.querySelectorAll('.card button');
    const notice = document.querySelector('#notice');

    buttons.forEach(function (button) {
      button.addEventListener('click', function () {
        notice.textContent = button.dataset.product + ' 상품을 장바구니에 담았습니다.';
      });
    });
  </script>
</body>
</html>
