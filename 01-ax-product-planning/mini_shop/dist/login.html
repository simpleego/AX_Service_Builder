<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소담상점 | 로그인</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="logo" href="index.html">소담<span>상점</span></a><nav><a href="index.html">상품</a><a class="active" href="login.html">로그인</a><a class="cart-link" href="cart.html">장바구니 <b class="cart-count">0</b></a></nav></header><main class="center-page"><section class="form-card"><p class="eyebrow">WELCOME BACK</p><h1>로그인</h1><p class="form-intro">소담상점에 다시 오신 것을 환영합니다.</p><form id="login-form"><label>이메일<input type="email" placeholder="hello@example.com" required></label><label>비밀번호<input type="password" minlength="4" placeholder="비밀번호를 입력하세요" required></label><div class="form-row"><label class="check"><input type="checkbox"> 로그인 상태 유지</label><a href="#">비밀번호 찾기</a></div><button class="button dark full" type="submit">로그인</button></form><p class="form-bottom">아직 회원이 아니신가요? <a href="#">회원가입</a></p><div class="study-note"><b>학습 포인트</b><p>이 화면은 <code>email</code>, <code>password</code>, <code>checkbox</code> 입력 태그와 HTML 기본 유효성 검사를 사용합니다.</p></div></section></main><script src="script.js"></script></body></html>
