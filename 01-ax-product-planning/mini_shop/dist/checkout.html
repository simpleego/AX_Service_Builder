<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소담상점 | 주문·결제</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="logo" href="index.html">소담<span>상점</span></a><nav><a href="index.html">상품</a><a href="login.html">로그인</a><a class="cart-link" href="cart.html">장바구니 <b class="cart-count">0</b></a></nav></header><main class="basic-page"><p class="eyebrow">CHECKOUT</p><h1>주문 / 결제</h1><div class="steps"><span>1 장바구니</span><i></i><span class="current">2 주문/결제</span><i></i><span>3 주문완료</span></div><form class="checkout-layout" id="checkout-form"><div class="checkout-forms"><fieldset><legend>배송 정보</legend><div class="two-columns"><label>받는 분<input type="text" required placeholder="이름"></label><label>연락처<input type="tel" required placeholder="010-0000-0000" pattern="[0-9-]+"></label></div><label>이메일<input type="email" required placeholder="hello@example.com"></label><div class="address-row"><label>우편번호<input type="text" required placeholder="12345"></label><button class="button outline" type="button">주소 찾기</button></div><label>주소<input type="text" required placeholder="기본 주소"></label><label>상세 주소<input type="text" placeholder="동·호수 등 상세 주소"></label><label>배송 요청사항<select><option>문 앞에 놓아주세요</option><option>경비실에 맡겨주세요</option><option>배송 전에 연락해주세요</option></select></label></fieldset><fieldset><legend>결제 방법</legend><div class="payment-options"><label><input type="radio" name="payment" value="card" checked> 신용·체크카드</label><label><input type="radio" name="payment" value="transfer"> 계좌이체</label><label><input type="radio" name="payment" value="phone"> 휴대폰 결제</label></div><label>카드사<select required><option value="">카드사를 선택하세요</option><option>국민카드</option><option>신한카드</option><option>현대카드</option><option>삼성카드</option></select></label><label class="check agree"><input type="checkbox" required> 주문 내용을 확인했으며 결제에 동의합니다.</label></fieldset></div><aside class="order-summary"><h2>최종 결제</h2><div><span>상품 금액</span><b id="checkout-subtotal">0원</b></div><div><span>배송비</span><b id="checkout-shipping">0원</b></div><hr><div class="total"><span>총 결제 금액</span><strong id="checkout-total">0원</strong></div><button class="button dark full" type="submit">결제하기</button><small>학습용 예제로 실제 결제는 이루어지지 않습니다.</small></aside></form></main><script src="script.js"></script></body></html>
