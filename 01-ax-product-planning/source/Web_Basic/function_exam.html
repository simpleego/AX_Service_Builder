<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 계산기</title>
    <style>
        input{
            padding: 8px;
            background-color: #ddd;
            text-align: right;
        }

        .container{
            width: 200px;
            margin: 0 auto;
        }

        .calc{
            border: 10px solid #ddd;
            padding: 10px;
            border-radius: 10%;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>간단한 계산기</h1>
    <form class="calc">
        <label for="num1">숫자 1:</label>
        <input type="number" id="num1" min=0 max=100 size="5" value="0" name="num1" required><br><br>

        <label for="num2">숫자 2:</label>
        <input type="number" id="num2" min=0 max=100 size="5" value="0" name="num2" required><br><br>

        <label for="operation">연산 선택</label>
        <select id="operation" name="operation">
            <option value="+">더하기(+)</option>
                <option value="-">빼기(-)</option>
                <option value="*">곱하기(*)</option>
                <option value="/">나누기(/)</option>
        </select><br><br>
        <button type="button" onclick="add()">+</button>
        <button type="button" onclick="sub()">-</button>
        <button type="button" onclick="mul()">*</button>
        <button type="button" onclick="div()">/</button>

        <button type="submit">계산하기</button>
        <button type="reset">초기화</button><br><br>

        <label for="operation">계산 결과:</label>
        <output id="result">여기에 결과가 표시된다.</output><br><br>        
    </form>
</div>
<script>  
function getNumber1(){
    // 입력값 얻기
    let num1 = document.getElementById("num1").value;
    // 숫자로 변환
    num1 = parseInt(num1);

    return num1;
} 

function getNumber2(){
    // 입력값 얻기
    let num2 = document.getElementById("num2").value;
    // 숫자로 변환
    num2 = parseInt(num2);

    return num2;
} 

function outResult(result){

    document.getElementById("result").innerHTML = result;
}

function add(){
    // 입력값 얻기
    let num1 = document.getElementById("num1").value;
    let num2 = document.getElementById("num2").value;
    // 숫자로 변환
    num1 = parseInt(num1);
    num2 = parseInt(num2);

    // 덧셈처리
    sum = num1+num2

    // 처리 결과 출력
    document.getElementById("result").innerHTML = sum;
} 

function sub(){
    const result = sub1();

    document.getElementById("result").innerHTML = result;
}

function sub1(){   

    // 덧셈처리
    result = getNumber1() - getNumber2();

    return result;
} 

function mul(){
    // 입력값 얻기
    let num1 = getNumber1()
    let num2 = getNumber2()

    // 덧셈처리
    // result = num1 * num2
    result = mul1(num1,num2)
    console.log(result)

    // 처리 결과 출력
    outResult(result);    
} 

function mul1(num1,num2){
    return num1*num2;
}

</script>

</body>
</html>
