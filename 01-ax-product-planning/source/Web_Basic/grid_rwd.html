<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid 반응형 레이아웃</title>

    <style>
        /* 전체 요소 크기 계산 방식 통일 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* =========================================
           1. 모바일 기본 화면
           768px 미만
           한 줄 구조
           ========================================= */

        .container {
            display: grid;

            grid-template-columns: 1fr;

            grid-template-areas:
                "header"
                "nav"
                "main"
                "aside"
                "footer";

            gap: 10px;

            padding: 10px;
        }


        /* Header */
        header {
            grid-area: header;

            background-color: lightblue;
            padding: 20px;
        }


        /* Navigation */
        nav {
            grid-area: nav;

            background-color: lightgreen;
            padding: 20px;
        }


        /* Main */
        main {
            grid-area: main;

            background-color: lightyellow;
            padding: 20px;

            min-height: 300px;
        }


        /* Aside */
        aside {
            grid-area: aside;

            background-color: lightpink;
            padding: 20px;
        }


        /* Footer */
        footer {
            grid-area: footer;

            background-color: lightgray;
            padding: 20px;
        }


        /* =========================================
           2. 태블릿
           768px 이상
           2열 구조
           ========================================= */

        @media (min-width: 768px) {

            .container {

                grid-template-columns: 200px 1fr;

                grid-template-areas:
                    "header header"
                    "nav    main"
                    "aside  main"
                    "footer footer";
            }

        }


        /* =========================================
           3. 데스크탑
           1200px 이상
           3열 구조
           ========================================= */

        @media (min-width: 1200px) {

            .container {

                grid-template-columns:
                    200px 1fr 250px;

                grid-template-areas:
                    "header header header"
                    "nav    main   aside"
                    "footer footer footer";
            }

        }

    </style>
</head>


<body>

    <div class="container">

        <header>
            <h1>My Website</h1>
        </header>


        <nav>
            <h2>Menu</h2>

            <p>홈</p>
            <p>상품</p>
            <p>게시판</p>
            <p>로그인</p>
        </nav>


        <main>
            <h2>Main Content</h2>

            <p>
                이 영역은 웹사이트의 주요 내용이 표시되는 영역입니다.
            </p>

            <p>
                화면의 크기가 변경되면 Grid 구조도 변경됩니다.
            </p>
        </main>


        <aside>
            <h2>Aside</h2>

            <p>광고</p>
            <p>공지사항</p>
            <p>추천 콘텐츠</p>
        </aside>


        <footer>
            <p>Copyright 2026 My Website</p>
        </footer>

    </div>

</body>
</html>
