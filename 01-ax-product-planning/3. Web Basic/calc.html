<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 계산기</title>
    <style>
        input{
            padding: 8px;
            background-color: #ddd;
            text-align: right;
        }

        .container{
            width: 200px;
            margin: 0 auto;
        }

        .calc{
            border: 10px solid #ddd;
            padding: 10px;
            border-radius: 10%;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>간단한 계산기</h1>
    <form class="calc">
        <label for="num1">숫자 1:</label>
        <input type="number" id="num1" min=0 max=100 size="5" value="10" name="num1" required><br><br>

        <label for="num2">숫자 2:</label>
        <input type="number" id="num2" min=0 max=100 size="5" value="20" name="num2" required><br><br>

        <label for="operation">연산 선택</label>
        <select id="operation" name="operation">
            <option value="+">더하기(+)</option>
                <option value="-">빼기(-)</option>
                <option value="*">곱하기(*)</option>
                <option value="/">나누기(/)</option>
        </select><br><br>
        <button type="button" onclick="add()">+</button>
        <button type="button" onclick="sub()">-</button>
        <button type="button" onclick="mul()">*</button>
        <button type="button" onclick="div()">/</button>

        <button type="submit">계산하기</button>
        <button type="reset">초기화</button><br><br>

        <label for="operation">계산 결과:</label>
        <output id="result">여기에 결과가 표시된다.</output><br><br>        
    </form>
</div>
<script>

    function add() {
        // 숫자 2개 가져오기
        num1 = document.getElementById("num1").value;
        num2 = document.getElementById("num2").value;
        console.log(num1, num2);

        // 문자를 숫자로 변환
        num1 = parseInt(num1);
        num2 = parseInt(num2);
        console.log('num1 :' + num1);
        console.log('num2 :' + num2);

        // 더하기 연산
        result = num1 + num2; 

        // 결과 출력
        // alert('result :' + result);
        document.getElementById("result").textContent = result;
    }  

    function sub() {
        // 숫자 2개 가져오기
        num1 = document.getElementById("num1").value;
        num2 = document.getElementById("num2").value;
        console.log(num1, num2);

        // 문자를 숫자로 변환
        num1 = parseInt(num1);
        num2 = parseInt(num2);
        console.log('num1 :' + num1);
        console.log('num2 :' + num2);

        // 빼기 연산
        result = num1 - num2; 

        // 결과 출력
        // alert('result :' + result);
        document.getElementById("result").textContent = result;
    }  

    function mul() {
        // 숫자 2개 가져오기
        num1 = document.getElementById("num1").value;
        num2 = document.getElementById("num2").value;
        console.log(num1, num2);

        // 문자를 숫자로 변환
        num1 = parseInt(num1);
        num2 = parseInt(num2);
        console.log('num1 :' + num1);
        console.log('num2 :' + num2);

        // 곱하기 연산
        result = num1 * num2; 

        // 결과 출력
        // alert('result :' + result);
        document.getElementById("result").textContent = result;
    }  

    function div() {
        // 숫자 2개 가져오기
        num1 = document.getElementById("num1").value;
        num2 = document.getElementById("num2").value;
        console.log(num1, num2);

        // 문자를 숫자로 변환
        num1 = parseInt(num1);
        num2 = parseInt(num2);
        console.log('num1 :' + num1);
        console.log('num2 :' + num2);

        // 나누기 연산
        if(num2 === 0){
            alert('0으로 나눌 수 없습니다.');
            return;
        }
        result = num1 / num2; 

        // 결과 출력
        // alert('result :' + result);
        document.getElementById("result").textContent = result;
    }

</script>

</body>
</html>
