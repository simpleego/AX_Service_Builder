# Chapter 01. 데이터베이스 시스템

> **이 장의 위치**: 데이터베이스가 무엇이고 왜 필요한지, 그리고 어떤 요소로 이루어지는지 큰 그림을 잡는 장입니다.
> 앞으로 2장~9장의 모든 SQL 실습은 **마당서점 데이터베이스**(고객 `Customer`, 도서 `Book`, 주문 `Orders`)를 사용하며, SQL은 **MySQL 8.0** 기준입니다.

## 0. 실습 무대 소개 — 마당서점 데이터베이스

이 강의 전체에서 사용하는 예제 데이터베이스입니다. 1장에서는 구조만 눈에 익혀 두고, 실제 SQL은 3장부터 본격적으로 다룹니다.

### 0.1 테이블 관계(ERD)

```mermaid
erDiagram
    Customer ||--o{ Orders : "주문한다"
    Book     ||--o{ Orders : "주문된다"

    Customer {
        INT      custid  PK "고객번호"
        VARCHAR  name       "이름"
        VARCHAR  address    "주소"
        VARCHAR  phone      "전화번호"
    }
    Book {
        INT      bookid   PK "도서번호"
        VARCHAR  bookname    "도서이름"
        VARCHAR  publisher   "출판사"
        INT      price       "정가"
    }
    Orders {
        INT    orderid   PK "주문번호"
        INT    custid    FK "고객번호"
        INT    bookid    FK "도서번호"
        INT    saleprice    "판매가격"
        DATE   orderdate    "주문일자"

```

> 💡 **읽는 법**: 고객 한 명은 주문을 0건 이상 할 수 있고(`||--o{`), 도서 한 권도 0번 이상 주문될 수 있습니다. `Orders`는 두 테이블을 이어 주는 **연결 테이블**입니다.

## 1. 데이터베이스와 데이터베이스 시스템

### 1.1 데이터 · 정보 · 지식

| 구분 | 의미 | 마당서점 예시 |
|---|---|---|
| **데이터** (data) | 관찰 결과로 나타난 정량적·정성적 **실제 값** | `축구의 역사, 7000`, `2020-07-01` |
| **정보** (information) | 데이터에 **의미를 부여**한 것 | "7월 첫 주 최다 판매 도서는 *축구의 역사*이다" |
| **지식** (knowledge) | 사물이나 현상에 대한 **이해** | "월드컵 시즌에는 축구 도서 재고를 늘려야 한다" |

```mermaid
flowchart LR
    D["📊 데이터<br/>관찰된 사실·값"] -->|"의미 부여<br/>(가공·분석)"| I["💡 정보<br/>의사결정에 쓸 수 있는 내용"]
    I -->|"추론·일반화"| K["🧠 지식<br/>상황에 대한 이해·규칙"]
```

### 1.2 데이터베이스의 정의

> **데이터베이스(Database)** : 조직에 필요한 정보를 얻기 위해 **논리적으로 연관된 데이터를 모아 구조적으로 통합**해 놓은 것

데이터베이스가 담고 있는 데이터는 다음 **네 가지 성격**을 동시에 가집니다.

| 개념 | 설명 |
|---|---|
| **통합된 데이터** (integrated) | 각자 쓰던 데이터의 **중복을 최소화**하여 중복으로 인한 불일치를 제거 |
| **저장된 데이터** (stored) | 문서가 아니라 디스크·테이프 등 **컴퓨터 저장장치**에 저장 |
| **운영 데이터** (operational) | 조직의 **업무 수행**을 위해 저장된 데이터 |
| **공용 데이터** (shared) | 한 사람·한 업무가 아니라 **여럿이 공동으로** 사용 |

**[그림] 데이터베이스의 개념 — 운영 · 공용 · 통합 · 저장** (대학 예시)

```mermaid
flowchart LR
    subgraph OP["① 운영 — 업무에 쓰는 사람들"]
        direction TB
        S["🎓 학생"]
        P["👨‍🏫 교수"]
        E["🧑‍💼 교직원"]
    end
    SH{{"② 공용<br/>⇄ 함께 사용"}}
    U[("③ 통합<br/>대학 데이터베이스")]
    subgraph ST["④ 저장 — 컴퓨터 저장장치"]
        direction TB
        D1[("학사 DB")]
        D2[("등록 DB")]
        D3[("수강 DB")]
    end
    S & P & E <--> SH <--> U
    U --- D1 & D2 & D3
```

> 같은 구조를 마당서점에 적용하면 — 운영: 매장 직원·회계 담당·쇼핑몰 고객 / 공용: 모두 같은 DB 사용 / 통합: 마당서점 DB / 저장: `Customer` · `Book` · `Orders`

### 1.3 데이터베이스의 특징

```mermaid
flowchart TB
    DB[("데이터베이스")]
    DB --- R["⏱ 실시간 접근성<br/>요청 후 수 초 내 응답"]
    DB --- C["🔄 계속적인 변화<br/>삽입 · 삭제 · 수정으로 항상 최신 상태"]
    DB --- S["👥 동시 공유<br/>여러 사용자·프로그램이 동시에 사용"]
    DB --- V["🔍 내용에 따른 참조<br/>물리적 위치가 아닌 값으로 검색"]
```

| 특징 | 마당서점 예시 |
|---|---|
| 실시간 접근성 | 고객이 "축구" 검색 → 즉시 결과 표시 |
| 계속적인 변화 | 새 주문이 들어오면 `Orders`에 행이 **INSERT** 됨 |
| 동시 공유 | 본점·지점 직원이 동시에 같은 `Book` 테이블 조회 |
| 내용에 따른 참조 | "디스크 3번 블록" 이 아니라 `WHERE publisher = '굿스포츠'` 로 찾음 |

> 💡 데이터베이스 작업은 크게 **검색**과 **변경**(삽입·삭제·수정)으로 나뉩니다.
> 검색만 하는 DB(예: 도서관 소장 목록)는 구축이 쉽고, 변경이 잦은 DB(예: 주식 거래)는 구축이 어렵습니다.

### 1.4 데이터베이스 시스템의 구성 요소

```mermaid
flowchart LR
    U["👤 데이터베이스 사용자<br/>일반 사용자 · 응용 프로그래머<br/>SQL 사용자 · DBA"]
    subgraph SYS["데이터베이스 시스템"]
        direction TB
        DBMS["① DBMS<br/>사용자와 DB를 연결하는 소프트웨어"]
        DBS[("② 데이터베이스<br/>데이터를 모아 둔 토대")]
        DM["③ 데이터 모델<br/>데이터 저장 기법에 관한 내용<br/>(눈에 보이지 않음)"]
    end
    U <--> DBMS
    DBMS <--> DBS
    DM -.-> DBS
```

| 구성 요소 | 역할 | 물리적 위치 |
|---|---|---|
| ① DBMS | 사용자와 데이터베이스를 **연결**하는 소프트웨어 | DB 서버에 설치된 프로그램 |
| ② 데이터베이스 | 데이터를 **모아 둔** 토대 | DB 서버의 디스크 |
| ③ 데이터 모델 | 데이터가 **저장되는 기법**에 관한 내용 | 개념이므로 **눈에 보이지 않음** |

## 2. 데이터베이스 시스템의 발전

### 2.1 마당서점으로 보는 정보 시스템의 발전

```mermaid
timeline
    title 마당서점의 성장과 정보통신기술
    1970년대 : 1단계 마당서점 시작
             : 도서 100권, 사장이 직접 안내
             : 계산기 + 장부 (정보 시스템 없음)
    1980년대 : 2단계 초기 전산화
             : 도서 1,000권, 직원 고용
             : 컴퓨터 + 파일 시스템
    1990년대 : 3단계 지점 개설 · DB 구축
             : 도서 10,000권, 서울 지역 고객
             : 클라이언트/서버 + DBMS 도입
    2000년대 : 4단계 홈페이지 구축
             : 도서 100,000권, 전국 배송
             : 인터넷 + 웹 DB 시스템
    2010년대 : 5단계 인터넷 쇼핑몰
             : 도서 1,000,000권 + 음반·문구 등
             : 스마트폰 + 여러 대의 DB 서버
```

| 단계 | 시기 / 기술 | 주요 특징 |
|---|---|---|
| 1단계 마당서점 | 1970년대 / 없음 | 사장이 제목·가격 기억, 매출 관리 부정확 |
| 2단계 초기 전산화 | 1980년대 / 컴퓨터 | 초기 응용 프로그램, **파일 시스템**, 한 대의 컴퓨터에서만 관리 |
| 3단계 데이터베이스 구축 | 1990년대 / 컴퓨터+원격통신 | 지점 간 **클라이언트/서버**, **DBMS 도입** |
| 4단계 홈페이지 구축 | 2000년대 / 컴퓨터+인터넷 | 인터넷 검색·주문, **웹 DB 시스템**으로 불특정 다수 고객 |
| 5단계 인터넷 쇼핑몰 | 2010년대 / +스마트폰 | 종합 쇼핑몰로 확대, 도서 외 매출 50% 이상, **분산 DB** |

### 2.2 정보 시스템의 4가지 형태

#### ① 파일 시스템
- 데이터를 **파일 단위**로 파일 서버에 저장, 각 응용 프로그램이 직접 `open/close`
- 프로그램마다 독립적으로 파일을 다루므로 **데이터 중복**, 동시 접근 시 **일관성 훼손** 가능

```mermaid
flowchart LR
    P1["💻 응용 프로그램 A"] -- "open/close" --> FS[("파일 서버<br/>book.dat · order.dat")]
    P2["💻 응용 프로그램 B"] -- "open/close" --> FS
    P3["💻 응용 프로그램 C"] -- "open/close" --> FS
```

#### ② 데이터베이스 시스템
- **DBMS**가 데이터를 통합 관리 — DBMS가 있는 쪽이 **서버**, 요청하는 쪽이 **클라이언트**
- DBMS가 일관성 유지, 복구, 동시 접근 제어를 담당 → 중복 감소, 표준화, 무결성 유지

```mermaid
flowchart LR
    C1["💻 클라이언트 1"] -- "SQL 요청" --> S
    C2["💻 클라이언트 2"] -- "SQL 요청" --> S
    subgraph S["DB 서버"]
        DBMS["DBMS"] --> D[("DB")]
    end
```

#### ③ 웹 데이터베이스 시스템
- 데이터베이스를 **웹 브라우저**에서 사용하도록 서비스 — 온라인 상거래, 공공 민원 등

```mermaid
flowchart LR
    B1["🌐 웹 브라우저"] --> W["웹 서버<br/>(WAS)"]
    B2["📱 모바일"] --> W
    W --> DBMS["DBMS"] --> D[("DB")]
```

#### ④ 분산 데이터베이스 시스템
- 여러 곳에 분산된 **DBMS 서버를 연결**하여 운영 — 대규모 응용 시스템

```mermaid
flowchart LR
    U["👥 사용자"] --> N(("네트워크"))

## 3. 파일 시스템과 DBMS

### 3.1 마당서점 데이터를 저장하는 3가지 방법

같은 "도서 목록 출력" 기능을 세 가지 방식으로 구현해 봅니다.

#### [프로그램 1] 데이터를 프로그램 내부에 저장

```c
struct BOOK { int bookid; char bookname[40]; char publisher[40]; int price; };

int main() {
    struct BOOK BOOKS[] = {               /* 데이터 정의 + 데이터 값 모두 코드 안에 */
        {1, "축구의 역사", "굿스포츠", 7000},
        {2, "축구 아는 여자", "나무수", 13000},
    };
    /* ... 출력 ... */
}
```
- ❌ 새 도서가 생길 때마다 **프로그램 수정 + 재컴파일**

#### [프로그램 2] 파일 시스템을 사용

```c
struct BOOK { int bookid; char bookname[40]; char publisher[40]; int price; };  /* 정의는 코드에 */

int main() {
    FILE *fp = fopen("book.dat", "r");     /* 값은 파일에 */
    /* fscanf(...)로 읽어 BOOKS[]에 저장 후 출력 */
}
```
- ⭕ 데이터 값이 바뀌어도 재컴파일 불필요
- ❌ 데이터 **구조**가 바뀌면 재컴파일, 여러 프로그램이 같은 파일을 안전하게 **공유하기 어려움**

#### [프로그램 3] DBMS를 사용

```sql
-- 데이터 정의는 DBMS가 관리 (한 번만 실행)
CREATE TABLE Book (
    bookid    INT PRIMARY KEY,
    bookname  VARCHAR(40),
    publisher VARCHAR(40),
    price     INT
);

-- 프로그램은 필요한 데이터를 SQL로 "요청"만 한다
SELECT * FROM Book;
```
- ⭕ 데이터 값·구조가 바뀌어도 **프로그램 재컴파일 불필요**
- ⭕ 정의·변경을 위한 별도 도구를 DBMS가 제공

```mermaid
flowchart TB
    subgraph P1["프로그램 1"]
        A1["프로그램<br/>= 정의 + 값"]
    end
    subgraph P2["프로그램 2"]
        A2["프로그램<br/>= 정의"] --> F2[("book.dat<br/>= 값")]
    end
    subgraph P3["프로그램 3"]
        A3["프로그램<br/>= SQL 요청만"] --> M3["DBMS<br/>= 정의 관리"] --> D3[("DB<br/>= 값")]
    end
    P1 ~~~ P2 ~~~ P3
```

| 방식 | 데이터 정의 위치 | 데이터 값 위치 | 값 변경 시 재컴파일 | 구조 변경 시 재컴파일 |
|---|---|---|:---:|:---:|
| 프로그램 1 | 프로그램 | 프로그램 | ✅ 필요 | ✅ 필요 |
| 프로그램 2 | 프로그램 | 파일 | ❌ 불필요 | ✅ 필요 |
| 프로그램 3 | **DBMS** | **DB** | ❌ 불필요 | ❌ 불필요 |

### 3.2 파일 시스템과 DBMS의 비교

**[그림] 파일 시스템으로 구축한 구매·판매 업무** — 프로그램마다 파일 정의·관리 코드를 따로 가짐

```mermaid
flowchart LR
    B1["🧑‍💼 구매 담당"] <--> A1
    subgraph A1["구매 응용 프로그램"]
        direction TB
        A1S["구매 관리 화면"]
        A1D["파일 정의 + 파일 관리"]
    end
    A1 <--> F1[("구매 파일")]

    B2["🧑‍💼 판매 담당"] <--> A2
    subgraph A2["판매 응용 프로그램"]
        direction TB
        A2S["판매 관리 화면"]
        A2D["파일 정의 + 파일 관리"]
    end
    A2 <--> F2[("판매 파일")]

    style A1D fill:#ffd3d3,stroke:#d33
    style A2D fill:#ffd3d3,stroke:#d33
```

**[그림] DBMS로 구축한 구매·판매 업무** — 데이터 정의·관리를 DBMS 한 곳으로 모음

```mermaid
flowchart LR
    B1["🧑‍💼 구매 담당"] <--> P1["구매 응용 프로그램<br/>(구매 관리 화면)"]
    B2["🧑‍💼 판매 담당"] <--> P2["판매 응용 프로그램<br/>(판매 관리 화면)"]
    P1 & P2 <--> M["DBMS<br/>구매/판매 데이터 정의 및 관리"]
    M <--> D[("구매/판매<br/>데이터베이스")]

    style M fill:#d6f5d6,stroke:#2a2
```

> 🔎 **차이 포인트**: 파일 시스템에서는 빨간 부분(파일 정의·관리)이 프로그램마다 **중복**됩니다. DBMS에서는 이 부분이 초록색 DBMS 하나로 **통합**되어, 프로그램은 화면(업무 로직)만 신경 쓰면 됩니다.

| 구분 | 파일 시스템 | DBMS |
|---|---|---|
| 데이터 정의 | 응용 프로그램 | DBMS |
| 데이터 저장 | 파일 시스템 | 데이터베이스 |
| 데이터 접근 방법 | 응용 프로그램이 파일에 **직접** 접근 | 응용 프로그램이 DBMS에 접근을 **요청** |
| 사용 언어 | 자바, C++, C 등 | 자바, C++, C 등 **+ SQL** |
| CPU / 주기억장치 사용 | 적음 | 많음 |

### 3.3 DBMS의 장점

| 장점 | 설명 |
|---|---|
| 데이터 중복 최소화 | 데이터를 공유하므로 중복 가능성이 낮음 |
| 데이터 일관성 유지 | 중복 제거로 일관성 유지 |
| 데이터 독립성 유지 | 데이터 정의와 프로그램이 서로 독립 |
| 관리 기능 제공 | 복구, 보안, 동시성 제어 등 |
| 프로그램 개발 생산성 향상 | 짧은 시간에 큰 프로그램 개발 가능 |
| 기타 | 데이터 무결성 유지, 데이터 표준 준수 용이 |

> 💡 **마당서점 예시**: 고객 주소가 바뀌면 파일 시스템에서는 *판매 파일*·*배송 파일* 등을 모두 고쳐야 하지만(누락 시 불일치), DBMS에서는 `Customer` 테이블 한 곳만 `UPDATE` 하면 됩니다.

## 4. 데이터베이스 시스템의 구성

**[그림] 데이터베이스 시스템의 구성** — 사용자 → 인터페이스 → DBMS(주기억장치) → 데이터베이스(하드디스크)

```mermaid
flowchart TB
    subgraph USER["사용자"]
        U1["일반 사용자"]; U2["응용 프로그래머"]; U3["SQL 사용자"]; U4["DBA"]
    end
    subgraph IF["인터페이스"]
        I1["응용 프로그램 화면"]; I2["응용 프로그램 개발"]; I3["SQL 질의"]; I4["DB 스키마"]
    end
    subgraph DBMS["DBMS (주기억장치)"]
        E["Embedded DML"]; DML["DML 컴파일러"]; DDL["DDL 컴파일러"]
        OBJ["오브젝트 코드"] --> Q["질의처리기"]
        E --> Q; DML --> Q; DDL --> Q
        Q --> TM["트랜잭션 관리자"] & FM["파일 관리자"] & BM["버퍼 관리자"]
    end
    subgraph DB["데이터베이스 (하드디스크)"]
        DF[("데이터 파일")]; IX[("인덱스")]; ST[("데이터 통계")]; DIC[("데이터 사전")]
    end
    U1-->I1-->OBJ
    U2-->I2-->E
    U3-->I3-->DML
    U4-->I4-->DDL
    DBMS <--> DB
```

| DBMS 내부 요소 | 역할 |
|---|---|
| DDL 컴파일러 | DBA가 정의한 스키마(`CREATE` 등)를 해석해 **데이터 사전**에 기록 |
| DML 컴파일러 | SQL 사용자의 질의(`SELECT` 등)를 해석 |
| Embedded DML | 응용 프로그램(Java, C 등) 안에 포함된 SQL을 처리 |
| 질의처리기 | 질의를 최적화·실행 계획으로 바꿔 실행 |
| 트랜잭션 관리자 | 동시성 제어·회복 담당 → **8장** |
| 파일 관리자 / 버퍼 관리자 | 디스크 파일 접근 / 주기억장치 버퍼 관리 |

| 데이터베이스 내부 요소 | 내용 |
|---|---|
| 데이터 파일 | 실제 데이터 (`Book`, `Customer`, `Orders`의 행) |
| 인덱스 | 빠른 검색을 위한 구조 → **4장** |
| 데이터 통계 | 질의 최적화에 쓰는 통계 정보 |
| 데이터 사전 | 테이블·열·사용자 등 **메타데이터**(데이터에 대한 데이터) |

### 4.1 데이터베이스 언어 — SQL

**SQL(Structured Query Language)** 은 DBMS에게 일을 시키는 표준 언어입니다.

| 분류 | 역할 | 대표 명령어 | 다루는 장 |
|---|---|---|---|
| **DDL** (Data Definition Language) 데이터 정의어 | 테이블 등 **구조** 정의·변경·삭제 | `CREATE` `ALTER` `DROP` | 3장 |
| **DML** (Data Manipulation Language) 데이터 조작어 | 데이터 **검색·삽입·수정·삭제** | `SELECT` `INSERT` `UPDATE` `DELETE` | 3~4장 |
| **DCL** (Data Control Language) 데이터 제어어 | 데이터 사용 **권한** 관리 | `GRANT` `REVOKE` | 9장 |

```mermaid
flowchart LR
    SQL{{SQL}} --> DDL["DDL<br/>구조를 만든다"]
    SQL --> DML["DML<br/>데이터를 다룬다"]
    SQL --> DCL["DCL<br/>권한을 통제한다"]
    DDL --> d1["CREATE / ALTER / DROP"]
    DML --> d2["SELECT / INSERT / UPDATE / DELETE"]
    DCL --> d3["GRANT / REVOKE"]
```

> 💡 `COMMIT`, `ROLLBACK`처럼 트랜잭션을 제어하는 명령은 **TCL**(Transaction Control Language)로 따로 분류하기도 합니다 → **8장**

#### 🧪 [실습 1-1] 첫 번째 SQL — 마당서점 맛보기

> **질의 1-1** `Book` 테이블에서 모든 도서이름(bookname)과 출판사(publisher)를 검색하시오.

```sql
SELECT bookname, publisher
FROM   Book;
```

| bookname | publisher |
|---|---|
| 축구의 역사 | 굿스포츠 |
| 축구 아는 여자 | 나무수 |
| 축구의 이해 | 대한미디어 |
| 골프 바이블 | 대한미디어 |
| 피겨 교본 | 굿스포츠 |
| … (총 10행) | … |

> **질의 1-2** 가격(price)이 10,000원 이상인 도서이름과 출판사를 검색하시오.

```sql
SELECT bookname, publisher
FROM   Book
WHERE  price >= 10000;
```

| bookname | publisher |
|---|---|
| 축구 아는 여자 | 나무수 |
| 축구의 이해 | 대한미디어 |
| 골프 바이블 | 대한미디어 |
| 야구의 추억 | 이상미디어 |
| 야구를 부탁해 | 이상미디어 |
| Olympic Champions | Pearson |

```mermaid
flowchart LR
    T[("Book<br/>10행 × 4열")] -->|"FROM Book"| A["전체 행"]
    A -->|"WHERE price >= 10000"| B["조건에 맞는 6행"]
    B -->|"SELECT bookname, publisher"| C["2개 열만 출력"]
```

> 💡 SQL은 **"무엇을(What)"** 원하는지만 기술하는 **비절차적 언어**입니다. 디스크의 어디서 어떻게 찾을지는 DBMS가 결정합니다. → *내용에 따른 참조*

### 4.2 데이터베이스 사용자

| 사용자 | 하는 일 | 마당서점 예시 |
|---|---|---|
| **일반 사용자** | 프로그래머가 만든 프로그램으로 DB에 접근 | 매장 직원, 쇼핑몰 고객 |
| **응용 프로그래머** | 자바·C·JSP 등 + SQL로 사용자 인터페이스와 응용 로직 개발 | 쇼핑몰 개발자 |
| **SQL 사용자** | 프로그램으로 구현되지 않은 업무를 SQL로 직접 처리 | "월별 매출 통계 뽑아 주세요" 담당자 |
| **DBA** (데이터베이스 관리자) | 설계·구현·유지보수 총괄, 사용자 통제, 보안, 성능 모니터링, 백업/이동 | 마당서점 DB 관리 책임자 |

**사용자별 필요 지식 수준** (× 없음, ○ 보통, ◎ 높음)

| 구분 | SQL 언어 | 프로그래밍 능력 | DBMS 지식 | 데이터 구성 |
|---|:---:|:---:|:---:|:---:|
| 일반 사용자 | × | × | × | × |
| SQL 사용자 | ◎ | × | ○ | ○ |
| 응용 프로그래머 | ◎ | ◎ | ○ | ○ |
| DBA | ◎ | ○ | ◎ | ◎ |

### 4.3 DBMS의 기능

| 기능 | 설명 | 관련 SQL / 장 |
|---|---|---|
| **데이터 정의** | 데이터 구조 정의·변경·삭제 | DDL (3장) |
| **데이터 조작** | 검색·삽입·수정·삭제 지원 | DML (3~4장) |
| **데이터 추출** | 사용자 조회·응용 프로그램용 데이터 추출 | SELECT, 뷰 (4장) |
| **데이터 제어** | 사용자 생성·모니터링·접근 제어, **백업·회복, 동시성 제어** | DCL, 트랜잭션 (8~9장) |

### 4.4 데이터 모델

데이터가 **어떤 구조로 저장되고 관계를 맺는지** 표현하는 방식입니다.

| 모델 | 관계 표현 방법 | 비고 |
|---|---|---|
| 계층 데이터 모델 | **포인터** (트리 구조) | 1960년대 |
| 네트워크 데이터 모델 | **포인터** (그래프 구조) | 1960년대 |
| **관계 데이터 모델** | **속성 값** (테이블) | 1970년대~ **가장 많이 사용** |
| 객체 데이터 모델 | **객체 식별자(OID)** | |
| 객체-관계 데이터 모델 | 관계 + 객체 장점 결합 | 오라클 등 상용 DBMS |

**학생-강좌 관계를 표현하는 세 가지 방법**

```mermaid
flowchart LR
    subgraph H["① 포인터 (계층·네트워크)"]
        s1["501 박지성"] -->|"포인터"| c1["102 자료구조"]

> 💡 **마당서점에 적용**: `Orders.custid = 1` 이라는 **값**만으로 이 주문이 `Customer`의 박지성(custid=1)과 관계가 있음을 나타냅니다. 이것이 관계 데이터 모델의 핵심이며 2장에서 자세히 다룹니다.

```sql
-- 미리보기: 값(custid)으로 두 테이블을 연결 (3장 '조인'에서 학습)
SELECT c.name, o.orderid, o.saleprice
FROM   Customer c, Orders o
WHERE  c.custid = o.custid
  AND  c.name = '박지성';
```

### 4.5 데이터베이스의 개념적 구조 — ANSI 3단계 구조

**[그림] ANSI의 3단계 데이터베이스 구조**

```mermaid
flowchart TB
    subgraph EXT["외부 단계 — 사용자가 보는 데이터"]
        E1["외부 스키마 1<br/>(매장 직원용)"]
        E2["외부 스키마 2<br/>(회계 담당용)"]
        E3["외부 스키마 3<br/>(쇼핑몰 고객용)"]
    end
    C["개념 스키마 — 전체 데이터<br/>Customer · Book · Orders 정의"]
    I["내부 스키마 — DBMS가 보는 데이터<br/>레코드 배치 · 인덱스 · 압축"]
    DB[("데이터베이스<br/>(물리적 저장)")]

    E1 & E2 & E3 <-->|"외부/개념 매핑"| C
    C <-->|"개념/내부 매핑"| I
    I <--> DB
```

| 스키마 | 관점 | 개수 | 내용 |
|---|---|:---:|---|
| **외부 스키마** (external, sub schema) | 개별 사용자 | **여러 개** | 전체 DB 중 사용자에게 필요한 **논리적 일부** = **뷰(View)** 개념 |
| **개념 스키마** (conceptual) | 조직 전체 | **1개** | 전체 데이터베이스의 정의, **DBA**가 관리 |
| **내부 스키마** (internal) | 저장 장치 | **1개** | 실제 저장 방법 — 인덱스, 레코드 배치, 데이터 압축 등 |

- **외부/개념 매핑** : 외부 스키마의 데이터가 개념 스키마의 어느 부분인지 대응
- **개념/내부 매핑** : 개념 스키마의 데이터가 물리적 장치의 어디에, 어떻게 저장되는지 대응

#### 마당서점 3단계 구조 예시

```sql
-- [개념 스키마] 조직 전체의 테이블 정의 (DBA)
CREATE TABLE Customer (
    custid  INT PRIMARY KEY,
    name    VARCHAR(40),
    address VARCHAR(50),
    phone   VARCHAR(20)
);

-- [외부 스키마] 배송 담당자에게는 이름과 주소만 보여 준다 (4장 '뷰')
CREATE VIEW vw_Delivery AS
SELECT name, address
FROM   Customer;

-- [내부 스키마] 이름 검색을 빠르게 하기 위한 저장 구조 (4장 '인덱스')
CREATE INDEX ix_Customer_name ON Customer(name);
```

**[그림] 마당서점 데이터를 3단계로 바라보기**

```mermaid
flowchart TB
    subgraph EXT["외부 스키마 — 사용자별로 필요한 부분만"]
        direction LR
        V1["🚚 배송 담당<br/>vw_Delivery<br/>(name, address)"]
        V2["💰 회계 담당<br/>매출 뷰<br/>(orderdate, saleprice)"]
        V3["🛒 쇼핑몰 고객<br/>도서 목록 뷰<br/>(bookname, publisher, price)"]
    end
    subgraph CON["개념 스키마 — 무엇을 저장하는가 (속성 이름·관계)"]
        direction LR
        C1["Customer<br/>custid · name<br/>address · phone"]
        C3["Orders<br/>orderid · custid · bookid<br/>saleprice · orderdate"]
        C2["Book<br/>bookid · bookname<br/>publisher · price"]
        C1 --- C3 --- C2
    end
    subgraph INT["내부 스키마 — 어떻게 저장하는가 (자료형·저장 구조)"]
        direction LR
        I1["custid INT<br/>name VARCHAR(40) …"]
        I2["인덱스<br/>ix_Customer_name"]
        I3["레코드 배치 · 블록 · 압축"]
    end
    V1 --> C1
    V2 --> C3
    V3 --> C2
    CON --> INT
```

> 개념 스키마는 **무엇을** 저장하는지(속성 이름·관계), 내부 스키마는 **어떻게** 저장하는지(`INT`, `VARCHAR(40)` 같은 자료형, 인덱스, 저장 형식)를 나타냅니다.

| 단계 | 교재 예시 (수강신청 DB) | 마당서점 DB |
|---|---|---|
| 개념 스키마 | 학생(학번, 이름, 주소, 학년), 강좌(강좌번호, 과목이름, …), 등록, 교수, 과목, 강의실과 그 관계 | `Customer`, `Book`, `Orders`와 그 관계 |
| 내부 스키마 | 각 속성에 `char(18)` 등 저장 형식 지정 | `INT`, `VARCHAR(40)`, `DATE` 지정 + 인덱스 |

### 4.6 데이터 독립성

3단계 구조의 목적은 **한 단계의 변경이 다른 단계에 영향을 주지 않도록** 하는 것입니다.

```mermaid
flowchart TB
    E["외부 스키마<br/>(응용 프로그램)"]
    C["개념 스키마"]
    I["내부 스키마"]
    E <-->|"🛡 논리적 데이터 독립성"| C
    C <-->|"🛡 물리적 데이터 독립성"| I
```

| 구분 | 위치 | 의미 | 마당서점 예시 |
|---|---|---|---|
| **논리적 데이터 독립성** | 외부 ↔ 개념 | 개념 스키마가 바뀌어도 외부 스키마(응용 프로그램)에 영향 없음 | `Customer`에 `email` 열을 추가해도 `vw_Delivery`를 쓰는 배송 프로그램은 그대로 동작 |
| **물리적 데이터 독립성** | 개념 ↔ 내부 | 저장 구조가 바뀌어도 개념 스키마에 영향 없음 | `ix_Customer_name` 인덱스를 추가·삭제해도 `Customer` 테이블 정의와 SQL은 그대로 |

```sql
-- 논리적 독립성 확인: 개념 스키마 변경
ALTER TABLE Customer ADD email VARCHAR(50);
SELECT * FROM vw_Delivery;   -- 여전히 name, address 만 정상 조회

-- 물리적 독립성 확인: 내부 스키마 변경
DROP INDEX ix_Customer_name ON Customer;   -- MySQL은 ON 테이블명 필요
SELECT * FROM Customer WHERE name = '김연아';   -- 속도만 달라질 뿐 결과는 동일
```

> 💡 **물리적 독립성이 논리적 독립성보다 구현하기 쉽습니다.** 논리 구조 변경(열 삭제·이름 변경 등)은 이를 사용하는 뷰·프로그램에 영향을 줄 수 있기 때문입니다.

| 6 | DBMS의 장점 | 중복 최소화, 일관성·독립성·무결성 유지, 복구·보안·동시성 제어, 생산성 향상 |
| 7 | SQL | **DDL**(정의) · **DML**(조작) · **DCL**(제어) |

| 10 | 3단계 구조 | **외부(여러 개, 뷰) – 개념(1개, DBA) – 내부(1개, 물리)** |
| 11 | 데이터 독립성 | **논리적**(외부↔개념) · **물리적**(개념↔내부), 물리적 독립성이 더 구현 쉬움 |
